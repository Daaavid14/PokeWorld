  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle"
        font-family="sans-serif" font-size="14" font-weight="bold" fill="#0d0d1a">P</text>
  <defs>
    <radialGradient id="tokenGrad" cx="40%" cy="35%">
