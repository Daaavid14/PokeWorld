<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | PokéWorld</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .reset-container {
      max-width: 420px; width: 100%; padding: 20px;
    }
    .reset-card {
      background: var(--clr-bg-3);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-xl);
      padding: var(--space-xl);
    }
    .reset-logo {
      text-align: center;
      margin-bottom: var(--space-xl);
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--clr-yellow), var(--clr-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .reset-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      margin-bottom: var(--space-sm);
      color: var(--text-primary);
    }
    .reset-desc { color: var(--text-secondary); margin-bottom: var(--space-lg); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="reset-container">
    <div class="reset-card">
      <div class="reset-logo">🎮 PokéWorld</div>
      <h1 class="reset-title">Set New Password</h1>
      <p class="reset-desc">Enter your new password below.</p>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label for="resetPassword">New Password</label>
          <div class="password-wrap">
            <input type="password" id="resetPassword" placeholder="Min. 8 characters"
                   minlength="8" maxlength="128" autocomplete="new-password" required />
            <button type="button" class="toggle-pw" data-target="resetPassword" aria-label="Toggle">👁</button>
          </div>
          <div class="pw-strength-bar" aria-hidden="true">
            <div class="pw-strength-fill" id="pwStrengthFill"></div>
          </div>
          <span class="pw-strength-label" id="pwStrengthLabel"></span>
        </div>
        <div class="form-group" style="margin-top:12px">
          <label for="resetConfirm">Confirm Password</label>
          <div class="password-wrap">
            <input type="password" id="resetConfirm" placeholder="Repeat password"
                   minlength="8" maxlength="128" autocomplete="new-password" required />
            <button type="button" class="toggle-pw" data-target="resetConfirm" aria-label="Toggle">👁</button>
          </div>
          <span class="field-error" id="resetConfirmErr" role="alert"></span>
        </div>
        <div class="form-error" id="resetError" style="margin-top:12px" role="alert"></div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:16px" id="resetSubmitBtn">
          <span class="btn-text">Update Password</span>
          <span class="btn-spinner hidden" aria-hidden="true"></span>
        </button>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="/js/config.js"></script>
  <script>
    // Handle the auth event from Supabase email link
    _supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        // User clicked the reset link — they are now authenticated temporarily
        console.log('Password recovery session active');
      }
    });

    // Toggle password visibility
    document.querySelectorAll('.toggle-pw').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        if (!input) return;
        input.type = input.type === 'password' ? 'text' : 'password';
        btn.textContent = input.type === 'password' ? '👁' : '🙈';
      });
    });

    // Strength indicator
    document.getElementById('resetPassword')?.addEventListener('input', (e) => {
      const fill  = document.getElementById('pwStrengthFill');
      const label = document.getElementById('pwStrengthLabel');
      const pw = e.target.value;
      let score = 0;
      if (pw.length >= 8)          score++;
      if (pw.length >= 12)         score++;
      if (/[A-Z]/.test(pw))        score++;
      if (/[0-9]/.test(pw))        score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      const colors = ['transparent','#ff3b3b','#ff9800','#ffd500','#00e676','#00e676'];
      const labels = ['','Weak','Fair','Good','Strong','Very Strong'];
      const widths  = ['0%','20%','45%','65%','85%','100%'];
      if (fill)  { fill.style.width = widths[Math.min(score,5)]; fill.style.backgroundColor = colors[Math.min(score,5)]; }
      if (label) { label.textContent = labels[Math.min(score,5)]; label.style.color = colors[Math.min(score,5)]; }
    });

    // Form submit
    document.getElementById('resetForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPw  = document.getElementById('resetPassword')?.value;
      const confPw = document.getElementById('resetConfirm')?.value;
      const errEl  = document.getElementById('resetConfirmErr');
      const formErr = document.getElementById('resetError');

      if (!newPw || newPw.length < 8) {
        if (errEl) errEl.textContent = 'Password must be at least 8 characters.';
        return;
      }
      if (newPw !== confPw) {
        if (errEl) errEl.textContent = 'Passwords do not match.';
        return;
      }
      if (errEl) errEl.textContent = '';

      const btn = document.getElementById('resetSubmitBtn');
      const txt = btn?.querySelector('.btn-text');
      const spin = btn?.querySelector('.btn-spinner');
      if (btn) btn.disabled = true;
      txt?.classList.add('hidden');
      spin?.classList.remove('hidden');

      const { error } = await _supabase.auth.updateUser({ password: newPw });

      if (error) {
        if (formErr) { formErr.textContent = error.message; formErr.classList.add('show'); }
        if (btn) btn.disabled = false;
        txt?.classList.remove('hidden');
        spin?.classList.add('hidden');
        return;
      }

      // Success — redirect to dashboard
      if (formErr) formErr.classList.remove('show');
      alert('Password updated! Redirecting to your dashboard...');
      window.location.href = APP_CONFIG.dashboardUrl;
    });
  </script>
</body>
</html>
