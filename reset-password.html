<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | PokéWorld</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/reset-password.css" />
</head>
<body>
  <div class="reset-container">
    <div class="reset-card">
      <div class="reset-logo">🎮 PokéWorld</div>
      <h1 class="reset-title">Set New Password</h1>
      <p class="reset-desc">Enter your new password below.</p>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label for="resetPassword">New Password</label>
          <div class="password-wrap">
            <input type="password" id="resetPassword" placeholder="Min. 8 characters"
                   minlength="8" maxlength="128" autocomplete="new-password" required />
            <button type="button" class="toggle-pw" data-target="resetPassword" aria-label="Toggle">👁</button>
          </div>
          <div class="pw-strength-bar" aria-hidden="true">
            <div class="pw-strength-fill" id="pwStrengthFill"></div>
          </div>
          <span class="pw-strength-label" id="pwStrengthLabel"></span>
        </div>
        <div class="form-group">
          <label for="resetConfirm">Confirm Password</label>
          <div class="password-wrap">
            <input type="password" id="resetConfirm" placeholder="Repeat password"
                   minlength="8" maxlength="128" autocomplete="new-password" required />
            <button type="button" class="toggle-pw" data-target="resetConfirm" aria-label="Toggle">👁</button>
          </div>
          <span class="field-error" id="resetConfirmErr" role="alert"></span>
        </div>
        <div class="form-error" id="resetError" role="alert"></div>
        <button type="submit" class="btn btn-primary btn-full" id="resetSubmitBtn">
          <span class="btn-text">Update Password</span>
          <span class="btn-spinner hidden" aria-hidden="true"></span>
        </button>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="/js/config.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
